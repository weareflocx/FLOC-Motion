# fly.toml app configuration file generated for floc-motion on 2026-10-01T07:25:26+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'floc-motion'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  FLOC_PUBLIC_ORIGIN = 'https://floc-motion.fly.dev'
  FLOC_DATA_DIR = '/data/floc-motion'

[[mounts]]
  source = 'floc_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
